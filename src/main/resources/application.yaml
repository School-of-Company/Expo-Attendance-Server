server:
  # 배포·재기동 때 처리 중인 스캔을 마친 뒤 종료한다(#103). 새 요청은 받지 않는다
  shutdown: graceful
spring:
  lifecycle:
    # 스캔 한 건의 최대 소요 시간(다른 서비스 호출 읽기 3초 몇 번 + 락 대기 5초)보다 길게 둔다
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  application:
    name: expo-attention-server
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expo_attention}
    username: ${DB_USERNAME:expo_attention}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # QR 토큰 발급이 한 번에 최대 1000건을 넣으므로 INSERT를 묶어 보낸다
        jdbc.batch_size: 100
        order_inserts: true
internal:
  token: ${INTERNAL_TOKEN}
clients:
  user:
    url: ${USER_URL:}
    internal-token: ${USER_INTERNAL_TOKEN}
  expo:
    url: ${EXPO_URL:}
    internal-token: ${EXPO_INTERNAL_TOKEN}
  application:
    url: ${APPLICATION_URL:}
    internal-token: ${APPLICATION_INTERNAL_TOKEN}
preregister-entry:
  lead-minutes: ${PREREGISTER_ENTRY_LEAD_MINUTES:30}
program-attendance:
  require-code: ${PROGRAM_ATTENDANCE_REQUIRE_CODE:false}
entry-retry:
  window-seconds: ${ENTRY_RETRY_WINDOW_SECONDS:300}
qr-entry-review:
  enabled: ${QR_ENTRY_REVIEW_ENABLED:true}
  interval-ms: ${QR_ENTRY_REVIEW_INTERVAL_MS:300000}
expo-period-cache:
  ttl-seconds: ${EXPO_PERIOD_CACHE_TTL_SECONDS:30}
swagger:
  enabled: ${SWAGGER_ENABLED:false}
  include-internal: ${SWAGGER_INCLUDE_INTERNAL:false}
springdoc:
  # 게이트웨이가 /attendance 접두사로 이 서비스에 보내므로 문서도 그 아래에 둔다. swagger.enabled가 꺼져 있으면 제공하지 않는다
  api-docs:
    enabled: ${swagger.enabled}
    path: /attendance/v3/api-docs
  swagger-ui:
    enabled: ${swagger.enabled}
    path: /attendance/swagger-ui.html
management:
  server:
    # 기본은 서비스 포트와 같다(배포 헬스체크 경로를 바꾸지 않는다). 공통 메트릭 규약의 분리 포트(9464)를 쓰려면 METRICS_PORT를 지정한다
    port: ${METRICS_PORT:${server.port:8080}}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
eureka:
  instance:
    # 공용 Prometheus(Expo-Monitoring)가 Eureka로 이 인스턴스를 찾아 긁는다. 게이트웨이는 /actuator를 라우팅하지 않는다(#101)
    metadata-map:
      "[prometheus.scrape]": "true"
      "[prometheus.port]": ${METRICS_PORT:${server.port:8080}}
      "[prometheus.path]": /actuator/prometheus
logging:
  # 요청 상관 ID(X-Request-Id)를 모든 로그 줄에 붙인다(#104). 나머지 형식은 Spring Boot 기본을 따른다
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: ${LOG_LEVEL_ROOT:info}
    # 다른 서비스 호출 실패 원인(DEBUG로 올리면 회로가 열려 차단된 호출도 호출마다 남는다). 임시로 LOG_LEVEL_CLIENT=debug
    team.startup.expo.global.client: ${LOG_LEVEL_CLIENT:info}
    # 입구에서 시끄러우면 warn으로 올려 스캔 거절 로그를 끈다
    team.startup.expo.global.logging.ScanRejection: ${LOG_LEVEL_SCAN_REJECTION:info}
    feign: warn
    com.zaxxer.hikari: info
    org.flywaydb: info
