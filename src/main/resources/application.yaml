spring:
  application:
    name: expo-attention-server
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expo_attention}
    username: ${DB_USERNAME:expo_attention}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # QR 토큰 발급이 한 번에 최대 1000건을 넣으므로 INSERT를 묶어 보낸다
        jdbc.batch_size: 100
        order_inserts: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # 브로커가 죽어 있어도 릴레이가 오래 매달리지 않게 한다(기본 60초)
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
internal:
  token: ${INTERNAL_TOKEN}
clients:
  user:
    url: ${USER_URL:}
    internal-token: ${USER_INTERNAL_TOKEN}
  expo:
    url: ${EXPO_URL:}
    internal-token: ${EXPO_INTERNAL_TOKEN}
  application:
    url: ${APPLICATION_URL:}
    internal-token: ${APPLICATION_INTERNAL_TOKEN}
entry-events:
  recorded-topic: ${KAFKA_ENTRY_RECORDED_TOPIC:attention.entry.recorded}
preregister-entry:
  lead-minutes: ${PREREGISTER_ENTRY_LEAD_MINUTES:30}
program-attendance:
  require-code: ${PROGRAM_ATTENDANCE_REQUIRE_CODE:false}
