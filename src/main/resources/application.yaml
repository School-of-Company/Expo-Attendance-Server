server:
  # 배포·재기동 때 처리 중인 스캔을 마친 뒤 종료한다(#103). 새 요청은 받지 않는다
  shutdown: graceful
spring:
  lifecycle:
    # 스캔 한 건의 최대 소요 시간(다른 서비스 호출 읽기 3초 몇 번 + 락 대기 5초)보다 길게 둔다
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  application:
    name: expo-attention-server
  main:
    # stdout은 JSON 로그 줄만 둔다(배너는 여러 줄 평문이라 로그 수집기가 줄마다 깨진 로그로 받는다)
    banner-mode: "off"
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expo_attention}
    username: ${DB_USERNAME:expo_attention}
    password: ${DB_PASSWORD}
    hikari:
      # 입구 스캔은 취소 보호 락 안에서 다른 서비스를 부르는 동안 커넥션 하나를 쥔다. 기본값(10개)이면 다른 서비스가 느릴 때 동시 스캔 수가
      # 풀 크기에서 막혀 지연이 커진다. 부하 측정은 load-test/README.md(#102)
      maximum-pool-size: ${DB_POOL_SIZE:30}
      # 커넥션을 못 얻으면 기본 30초가 아니라 3초 안에 실패해, 스캐너가 오래 매달리지 않고 곧바로 다시 찍을 수 있게 한다
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
  transaction:
    # 락과 커넥션을 쥐는 트랜잭션의 상한. 다른 서비스 호출 읽기 3초와 락 대기 5초를 합친 최악의 스캔보다 길게 둔다
    default-timeout: ${TRANSACTION_TIMEOUT:15s}
  # 박람회 프로젝션(#240)만 쓴다. expo-projection.enabled가 꺼져 있으면 consumer가 뜨지 않아 브로커에 연결하지 않는다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # 처리하지 못한 메시지를 <토픽>.dlt로 보낼 때만 쓴다
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # QR 토큰 발급이 한 번에 최대 1000건을 넣으므로 INSERT를 묶어 보낸다
        jdbc.batch_size: 100
        order_inserts: true
internal:
  token: ${INTERNAL_TOKEN}
clients:
  user:
    url: ${USER_URL:}
    internal-token: ${USER_INTERNAL_TOKEN}
  expo:
    url: ${EXPO_URL:}
    internal-token: ${EXPO_INTERNAL_TOKEN}
  application:
    url: ${APPLICATION_URL:}
    internal-token: ${APPLICATION_INTERNAL_TOKEN}
preregister-entry:
  lead-minutes: ${PREREGISTER_ENTRY_LEAD_MINUTES:30}
program-attendance:
  require-code: ${PROGRAM_ATTENDANCE_REQUIRE_CODE:false}
  lead-minutes: ${PROGRAM_ATTENDANCE_LEAD_MINUTES:10}
qr-entry-review:
  enabled: ${QR_ENTRY_REVIEW_ENABLED:true}
  interval-ms: ${QR_ENTRY_REVIEW_INTERVAL_MS:300000}
cancellation-aborted-retention:
  # 중단된 취소 작업 기록(tb_cancellation_aborted)을 이 일수가 지나면 지운다. 0이면 지우지 않는다(기본)
  days: ${CANCELLATION_ABORTED_RETENTION_DAYS:0}
entry-replay:
  window-seconds: ${ENTRY_REPLAY_WINDOW_SECONDS:30}
# #247 동시 스캔 수 = hikari 풀 크기 - reserve. 스캔 하나가 커넥션을 둘 쥘 수 있어, 풀 크기에 닿으면 서로 기다리다 풀 타임아웃으로만 풀린다
scan-concurrency:
  reserve: ${SCAN_CONCURRENCY_RESERVE:6}
  wait-ms: ${SCAN_CONCURRENCY_WAIT_MS:500}
expo-period-cache:
  ttl-seconds: ${EXPO_PERIOD_CACHE_TTL_SECONDS:30}
# #240 박람회 변경 이벤트(expo.expo.changed)로 채우는 로컬 프로젝션. 켜면 기간·프로그램·회차를 프로젝션에서 먼저 읽고, 없으면 박람회 서비스를 부른다
expo-projection:
  enabled: ${KAFKA_EXPO_PROJECTION_ENABLED:false}
  group-id: ${KAFKA_EXPO_PROJECTION_GROUP_ID:${spring.application.name}.expo-changed}
# #141 실시간 입·퇴장 현황 변경 SSE(docs/admin-data-change-events.md). Gateway의 text/event-stream 전달을 확인한 뒤 켠다
admin-events:
  enabled: ${ATTENDANCE_ADMIN_EVENTS_ENABLED:false}
  max-connections: ${ATTENDANCE_ADMIN_EVENTS_MAX_CONNECTIONS:500}
  max-connections-per-expo: ${ATTENDANCE_ADMIN_EVENTS_MAX_CONNECTIONS_PER_EXPO:50}
  connection-lifetime: ${ATTENDANCE_ADMIN_EVENTS_CONNECTION_LIFETIME:PT30M}
  heartbeat-interval: ${ATTENDANCE_ADMIN_EVENTS_HEARTBEAT_INTERVAL:PT25S}
  coalesce-interval: ${ATTENDANCE_ADMIN_EVENTS_COALESCE_INTERVAL:PT1S}
swagger:
  enabled: ${SWAGGER_ENABLED:false}
  include-internal: ${SWAGGER_INCLUDE_INTERNAL:false}
springdoc:
  # 게이트웨이가 /attendance 접두사로 이 서비스에 보내므로 문서도 그 아래에 둔다. swagger.enabled가 꺼져 있으면 제공하지 않는다
  api-docs:
    enabled: ${swagger.enabled}
    path: /attendance/v3/api-docs
  swagger-ui:
    enabled: ${swagger.enabled}
    path: /attendance/swagger-ui.html
management:
  server:
    # 기본은 서비스 포트와 같다(배포 헬스체크 경로를 바꾸지 않는다). 공통 메트릭 규약의 분리 포트(9464)를 쓰려면 METRICS_PORT를 지정한다
    port: ${METRICS_PORT:${server.port:8080}}
  endpoint:
    health:
      # 배포 헬스체크의 /actuator/health는 그대로 두고 /actuator/health/liveness, /actuator/health/readiness를 더한다.
      # 준비 상태에는 DB만 넣는다(Flyway는 기동 중에 끝나야 트래픽을 받는다). 유저·박람회·신청 서비스는 넣지 않는다:
      # 다른 서비스 장애로 이 서비스가 트래픽에서 빠지면 안 된다. 생존 상태는 프로세스 상태만 본다
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # GC 일시 정지 p99를 구하려고 jvm_gc_pause_seconds에 고정 경계 10개(+Inf 포함 버킷 11개)를 둔다(Expo-Monitoring #34).
      # percentiles-histogram은 시리즈당 버킷이 약 69개라 카디널리티가 커서 쓰지 않는다
      slo:
        jvm.gc.pause: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
eureka:
  instance:
    # 공용 Prometheus(Expo-Monitoring)가 Eureka로 이 인스턴스를 찾아 긁는다. 게이트웨이는 /actuator를 라우팅하지 않는다(#101)
    metadata-map:
      "[prometheus.scrape]": "true"
      "[prometheus.port]": ${METRICS_PORT:${server.port:8080}}
      "[prometheus.path]": /actuator/prometheus
logging:
  # 형식은 logback-spring.xml(JSON 한 줄). 요청 상관 ID(X-Request-Id, #104)는 MDC requestId 키로 붙는다
  # 요청마다 접근 로그 한 줄(HttpAccessLogFilter, module=HttpAccess). /actuator와 API 문서 경로는 남기지 않는다
  http-access:
    enabled: ${LOGGING_HTTP_ACCESS_ENABLED:true}
  level:
    root: ${LOG_LEVEL_ROOT:info}
    # 다른 서비스 호출 실패 원인(DEBUG로 올리면 회로가 열려 차단된 호출도 호출마다 남는다). 임시로 LOG_LEVEL_CLIENT=debug
    team.startup.expo.global.client: ${LOG_LEVEL_CLIENT:info}
    # 입구에서 시끄러우면 warn으로 올려 스캔 거절 로그를 끈다
    team.startup.expo.global.logging.ScanRejection: ${LOG_LEVEL_SCAN_REJECTION:info}
    feign: warn
    # 컨테이너 오류 로그는 레코드 본문을 담을 수 있어 끈다. 실패는 ExpoProjectionKafkaConfig가 파티션·오프셋·예외 종류만 남긴다
    org.springframework.kafka.listener: "OFF"
    com.zaxxer.hikari: info
    org.flywaydb: info
