name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: PR 제목 형식 검증
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ ! "$TITLE" =~ ^\[(attendance|qr|global|ci/cd)\]\ .+ ]]; then
            echo "PR 제목은 '[scope] description' 형식이어야 합니다 (scope: attendance/qr/global/ci/cd)." >&2
            echo "main으로 가는 릴리즈 PR은 'vX.Y.Z' 형식도 허용됩니다." >&2
            echo "현재 제목: $TITLE" >&2
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - run: chmod +x gradlew

      - name: ktlint 검사
        run: ./gradlew ktlintCheck

      - name: 테스트
        run: ./gradlew test

      - name: 빌드
        run: ./gradlew build -x test -x ktlintCheck

  notify-discord:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Discord 알림 전송
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: success
          title: Expo Attention CI
          content: |
            <@${{ secrets.DISCORD_USER_ID_1 }}> <@${{ secrets.DISCORD_USER_ID_2 }}>
            확인해주세요.
